<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunset City - Android Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="dashboard-header">
        <h2>Infrastructure Grid</h2>
        <nav class="nav-tabs">
            <button class="tab-btn" onclick="window.location.href='index.html'">Main</button>
            <button class="tab-btn active" onclick="window.location.href='index2.html'">City View</button>
            <button class="tab-btn" onclick="window.location.href='index3.html'">Terminal</button>
        </nav>
    </header>

    <div class="pyramid-scene-background">
        <div class="cyber-sphere-sun"></div>
        <div class="pyramid-city"></div>
        <div class="moving-grid pyramid-grid"></div>
    </div>

    <div class="sub-nav-bar">
        <button class="sub-tab active" onclick="switchSubTab('sectors')">Sectors</button>
        <button class="sub-tab" onclick="switchSubTab('power')">Power Grid</button>
        <button class="sub-tab highlight" onclick="switchSubTab('override')">Override</button>
    </div>

    <div class="dashboard-content">
        <div id="sectors" class="matrix-card sub-tab-content active">
            <div>
                <h3>Sector Alpha</h3>
                <p>Traffic flow normal. Orange horizon stable.</p>
                <button class="cyber-btn" onclick="appController.showToast('Sector Alpha Optimized')">Execute Routine</button>
            </div>
        </div>
        <div id="power" class="matrix-card sub-tab-content">
            <div>
                <h3>Solar Array</h3>
                <p>Output running at 98.4% capacity.</p>
                <button class="cyber-btn" onclick="appController.showToast('Power Flux Stabilized')">Calibrate Array</button>
            </div>
        </div>
        <div id="override" class="matrix-card sub-tab-content">
            <div>
                <h3>Emergency Protocol</h3>
                <p>Warning: Sunset lock sequence manual override.</p>
                <button class="cyber-btn" style="border-color:#ff4800; color:#ff4800;" onclick="appController.showToast('Override Initiated!')">Activate Override</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
