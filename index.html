<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retrowave Sunset - Android Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Layers -->
    <div class="retrowave-landscape">
        <div class="glowing-sun"></div>
        <div class="moving-grid"></div>
    </div>

    <!-- Landing Page (Page 1) -->
    <div id="page1" class="page active">
        <div class="content">
            <h1 class="main-title">Sunset Arcade</h1>
            <p class="subtitle">Android Cyber Experience</p>
            <button class="enter-btn" onclick="switchPage(2)">Insert Coin</button>
        </div>
    </div>

    <!-- Dashboard Page (Page 2) -->
    <div id="page2" class="page">
        <header class="dashboard-header">
            <h2>Dashboard Control</h2>
            <nav class="nav-tabs">
                <button class="tab-btn active" onclick="switchPage(2)">Home</button>
                <button class="tab-btn" onclick="switchPage(3)">City View</button>
                <button class="tab-btn" onclick="switchPage(4)">Terminal</button>
                <button class="back-home-btn" onclick="switchPage(1)">Exit</button>
            </nav>
        </header>

        <div class="car-scene-background">
            <div class="striped-sun"></div>
            <div class="mountain-silhouette"></div>
            <div class="moving-grid car-grid"></div>
            <div class="retrowave-car">
                <div class="car-body"></div>
                <div class="car-lights"></div>
            </div>
        </div>

        <div class="dashboard-content">
            <div class="matrix-card">
                <h3>System Status</h3>
                <p>All core modules running on yellow sunset protocol.</p>
                <div class="action-grid">
                    <button class="cyber-card-btn" onclick="appController.triggerAction('boost')">
                        <span class="icon">⚡</span> Engine Boost
                    </button>
                    <button class="cyber-card-btn" onclick="appController.triggerAction('scan')">
                        <span class="icon">📡</span> Radar Scan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Integration -->
    <script src="app.js"></script>
</body>
</html>
